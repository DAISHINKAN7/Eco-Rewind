<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="Verdicts">
<title>Verdicts</title><style>text{font-family:'Inter Tight',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0E1A24}
.mu{fill:#5B6B78} .k{fill:#5B6B78;font-size:12px;letter-spacing:.18em;font-weight:600}
.h{font-weight:700;letter-spacing:-.02em} .m{font-family:'JetBrains Mono',Consolas,monospace}
.flow{stroke-dasharray:5 7;animation:flow 1.2s linear infinite} @keyframes flow{to{stroke-dashoffset:-24}}
.gx{transform-box:fill-box;transform-origin:left center;animation:gx 9s cubic-bezier(.2,.7,.2,1) infinite}
.gxr{transform-box:fill-box;transform-origin:right center;animation:gx 9s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes gx{0%{transform:scaleX(0)}18%{transform:scaleX(1)}92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.fade{animation:fade 9s ease infinite} @keyframes fade{0%,12%{opacity:0}22%,92%{opacity:1}100%{opacity:0}}
.draw{stroke-dasharray:2400;animation:draw 8s ease-in-out infinite} @keyframes draw{0%{stroke-dashoffset:2400}45%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:2400}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 8s ease infinite} @keyframes pop{0%,5%{transform:scale(0)}12%,92%{transform:scale(1)}100%{transform:scale(0)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite reverse} @keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2.4s ease-in-out infinite} @keyframes pulse{50%{opacity:.35}}
.scan{animation:scan 6s ease-in-out infinite} @keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(1080px)}100%{transform:translateX(0)}}</style>
<rect width="1200" height="510" rx="14" fill="#E8ECEF"/><line x1="40" y1="0" x2="40" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="120" y1="0" x2="120" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="200" y1="0" x2="200" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="280" y1="0" x2="280" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="360" y1="0" x2="360" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="440" y1="0" x2="440" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="520" y1="0" x2="520" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="600" y1="0" x2="600" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="680" y1="0" x2="680" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="760" y1="0" x2="760" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="840" y1="0" x2="840" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="920" y1="0" x2="920" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="1000" y1="0" x2="1000" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="1080" y1="0" x2="1080" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><line x1="1160" y1="0" x2="1160" y2="510" stroke="#C9D2D9" stroke-width=".5" opacity=".5"/><rect x=".5" y=".5" width="1199" height="509" rx="14" fill="none" stroke="#C9D2D9"/>
<text x="40" y="48" font-size="14" class="k" text-anchor="start" >THE ANSWER</text>
<text x="40" y="86" font-size="30" class="h" text-anchor="start" >One storm is attributable. The other is not.</text>
<rect x="40" y="100" width="44" height="3" fill="#FF4B2B"/>
<rect x="40" y="150" width="550" height="330" rx="8" fill="#F6F8F9" stroke="#C9D2D9"/>
<rect x="40" y="150" width="550" height="5" fill="#1F3A5F"/>
<text x="64" y="196" font-size="24" class="h" text-anchor="start" >Hurricane Ida · 2021</text>
<text x="64" y="220" font-size="13" class="mu" text-anchor="start" >Barataria Bay, Louisiana · Cat 4 landfall</text>
<g class="pop" style="animation-delay:0.30s"><rect x="416" y="176" width="150" height="34" rx="17" fill="#1F3A5F"/>
<text x="491" y="199" font-size="11" class="k" text-anchor="middle" style="fill:#fff">ATTRIBUTABLE</text></g>
<line x1="64" y1="236" x2="566" y2="236" stroke="#C9D2D9"/>
<text x="64" y="262" font-size="14" class="mu" text-anchor="start" >Landfall deficit</text>
<text x="566" y="262" font-size="15" class="m fade" text-anchor="end" style="animation-delay:0.40s">+0.021 … +0.101 NDVI</text>
<line x1="64" y1="278" x2="566" y2="278" stroke="#C9D2D9"/>
<text x="64" y="304" font-size="14" class="mu" text-anchor="start" >Time placebo</text>
<text x="566" y="304" font-size="15" class="m fade" text-anchor="end" style="animation-delay:0.55s">16 / 16 pass</text>
<line x1="64" y1="320" x2="566" y2="320" stroke="#C9D2D9"/>
<text x="64" y="346" font-size="14" class="mu" text-anchor="start" >Space placebo</text>
<text x="566" y="346" font-size="15" class="m fade" text-anchor="end" style="animation-delay:0.70s">11 / 16 pass</text>
<line x1="64" y1="362" x2="566" y2="362" stroke="#C9D2D9"/>
<text x="64" y="388" font-size="14" class="mu" text-anchor="start" >ρ vs track distance</text>
<text x="566" y="388" font-size="15" class="m fade" text-anchor="end" style="animation-delay:0.85s">−0.67  (−0.78 … −0.45)</text>
<line x1="64" y1="404" x2="566" y2="404" stroke="#C9D2D9"/>
<text x="64" y="430" font-size="14" class="mu" text-anchor="start" >Lasting damage, q1–3</text>
<text x="566" y="430" font-size="15" class="m fade" text-anchor="end" style="animation-delay:1.00s">≈ 0  (−0.005 … +0.002)</text>
<rect x="610" y="150" width="550" height="330" rx="8" fill="#F6F8F9" stroke="#C9D2D9"/>
<rect x="610" y="150" width="550" height="5" fill="#FF4B2B"/>
<text x="634" y="196" font-size="24" class="h" text-anchor="start" >Hurricane Irma · 2017</text>
<text x="634" y="220" font-size="13" class="mu" text-anchor="start" >Everglades, Florida · Cat 3 landfall</text>
<g class="pop" style="animation-delay:0.42s"><rect x="986" y="176" width="150" height="34" rx="17" fill="#FF4B2B"/>
<text x="1061" y="199" font-size="11" class="k" text-anchor="middle" style="fill:#fff">NOT ATTRIBUTABLE</text></g>
<line x1="634" y1="236" x2="1136" y2="236" stroke="#C9D2D9"/>
<text x="634" y="262" font-size="14" class="mu" text-anchor="start" >Landfall deficit</text>
<text x="1136" y="262" font-size="15" class="m fade" text-anchor="end" style="animation-delay:0.40s">small, inconsistent</text>
<line x1="634" y1="278" x2="1136" y2="278" stroke="#C9D2D9"/>
<text x="634" y="304" font-size="14" class="mu" text-anchor="start" >Time placebo</text>
<text x="1136" y="304" font-size="15" class="m fade" text-anchor="end" style="animation-delay:0.55s">7 / 10 pass</text>
<line x1="634" y1="320" x2="1136" y2="320" stroke="#C9D2D9"/>
<text x="634" y="346" font-size="14" class="mu" text-anchor="start" >Space placebo</text>
<text x="1136" y="346" font-size="15" class="m fade" text-anchor="end" style="animation-delay:0.70s">2 / 16 pass</text>
<line x1="634" y1="362" x2="1136" y2="362" stroke="#C9D2D9"/>
<text x="634" y="388" font-size="14" class="mu" text-anchor="start" >ρ vs track distance</text>
<text x="1136" y="388" font-size="15" class="m fade" text-anchor="end" style="animation-delay:0.85s">+0.39  (wrong sign)</text>
<line x1="634" y1="404" x2="1136" y2="404" stroke="#C9D2D9"/>
<text x="634" y="430" font-size="14" class="mu" text-anchor="start" >Why</text>
<text x="1136" y="430" font-size="15" class="m fade" text-anchor="end" style="animation-delay:1.00s">cloud + mangrove phenology</text></svg>